<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fancy Event Rentals offers event decoration rentals and setup services for weddings, birthdays, graduations, and other celebrations."
    />
    <title>Fancy Event Rentals</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luxurious+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="logo">
        <img
          class="logo-img"
          src="images/logo.png"
          alt="Fancy Event Rentals logo"
        />
        <p class="logo-text">Fancy Event Rentals</p>
      </div>

      <nav class="site-nav">
        <input type="checkbox" id="menu" />
        <label for="menu" class="hamburger">
          <span></span>
          <span class="visually-hidden">Toggle navigation menu</span>
        </label>
        <ul>
          <li><a href="index.html" aria-current="page">Home</a></li>
          <li><a href="rentals.html">Rentals</a></li>
          <li><a href="aboutUs.html">About Us</a></li>
          <li><a href="contactus.html">Contact Us</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- Hero Section -->
      <div>
        <img
          class="hero"
          src="images/hero.jpeg"
          alt="Event decor with tent, ivory backdrop ,floral arrangements, chairs, and tables."
          width="1280"
          height="960"
        />
      </div>
      <!--Gallery Section-->
      <section class="card wrapper">
        <h1 class="center">Event Gallery</h1>
        <div class="gallery-grid">
          <img
            src="images/balloonbackdrop.jpeg"
            alt="Event backdrop decorated with balloons"
          />
          <img
            src="images/grad.jpeg"
            alt="Graduation event decoration with balloons"
          />
          <img src="images/birthdayDecor.jpeg" alt="Birthday Balloon decor" />
          <img src="images/mascot.jpeg" alt="Mascot decor at event" />
          <img
            src="images/GradWhite.jpeg"
            alt="White graduation event decoration"
          />
          <img
            src="images/yard.jpeg"
            alt="White table setup with backdrop outdoor event decoration"
          />
        </div>
        <div class="center">
          <a class="button" href="rentals.html">View Rental Items</a>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="logo">
        <img
          class="logo-img"
          src="images/logo.png"
          alt="Fancy Event Rentals logo"
        />
        <p class="logo-text">Fancy Event Rentals</p>
      </div>
      <div class="social">
        <p>Social media</p>
        <a
          href="https://www.instagram.com/DECORBYMESSI/"
          target="_blank"
          aria-label="Visit Fancy Event Rentals on Instagram"
        >
          <img src="images/instagram.svg" alt="Instagram logo" />
        </a>
        <a
          href="https://www.tiktok.com/@mes_decor"
          aria-label="Visit Fancy Event Rentals on TikTok"
        >
          <img src="images/tiktok.svg" alt="tiktok logo" />
        </a>
      </div>
    </footer>
  </body>
</html>
